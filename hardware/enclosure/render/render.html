<!doctype html>
<html><head><meta charset="utf-8"><title>LightCheck render</title>
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const VIEW = q.get('view') || 'hero';
const BASE = '../stl/';   // serve hardware/enclosure/ as web root: python3 -m http.server 8765
const W = innerWidth, H = innerHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(26, W / H, 1, 5000);
camera.up.set(0, 0, 1);

scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa3ad, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(-120, -160, 320);
key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
const sc = key.shadow.camera; sc.left = -220; sc.right = 220; sc.top = 220; sc.bottom = -220; sc.near = 10; sc.far = 900;
key.shadow.radius = 6; key.shadow.bias = -0.0004; key.shadow.normalBias = 0.4;
scene.add(key);
const rim = new THREE.DirectionalLight(0xdfe9ff, 0.8); rim.position.set(220, 200, 160); scene.add(rim);

const loader = new STLLoader();
const load = (f) => new Promise((res, rej) => loader.load(BASE + f, res, undefined, rej));

function mat(color, name) {
  const m = { color: new THREE.Color(color), roughness: 0.62, metalness: 0.0 };
  if (/bezel/.test(name)) Object.assign(m, { roughness: 0.38, metalness: 0.55 });
  if (/shield|usb/.test(name)) Object.assign(m, { roughness: 0.3, metalness: 0.9 });
  if (/pins/.test(name)) Object.assign(m, { roughness: 0.25, metalness: 1.0 });
  if (/glass/.test(name)) Object.assign(m, { roughness: 0.15, metalness: 0.0 });
  if (/pcb/.test(name)) Object.assign(m, { roughness: 0.45 });
  if (/lid|base/.test(name)) Object.assign(m, { roughness: 0.68 });
  return new THREE.MeshStandardMaterial(m);
}

function addMesh(geom, color, name, offset = [0, 0, 0], edges = false) {
  geom.computeVertexNormals();
  const mesh = new THREE.Mesh(geom, mat(color, name));
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.position.set(...offset);
  scene.add(mesh);
  if (edges) {
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(geom, 35), new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.18 }));
    e.position.copy(mesh.position); scene.add(e);
  }
  return mesh;
}

function lcdTexture() {
  const c = document.createElement('canvas'); c.width = 1290; c.height = 320;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, c.height);
  grad.addColorStop(0, '#2f63ea'); grad.addColorStop(1, '#1c46c8');
  g.fillStyle = grad; g.fillRect(0, 0, c.width, c.height);
  // 16x2 character cells, 5x8 dots each
  const lines = ['CLux: 452.31', 'C G:25x   300ms'];
  const cellW = 74, cellH = 120, x0 = 54, y0s = [34, 172];
  g.font = 'bold 86px "DejaVu Sans Mono", monospace';
  g.textBaseline = 'top';
  for (let r = 0; r < 2; r++) {
    for (let i = 0; i < 16; i++) {
      const x = x0 + i * cellW, y = y0s[r];
      g.fillStyle = 'rgba(255,255,255,0.06)'; // unlit cell
      g.fillRect(x, y, cellW - 8, cellH - 6);
      const ch = lines[r][i] || ' ';
      if (ch !== ' ') {
        g.fillStyle = '#eef4ff';
        g.save(); g.beginPath(); g.rect(x, y, cellW - 8, cellH - 6); g.clip();
        g.textAlign = 'center'; g.fillText(ch, x + (cellW - 8) / 2, y + 14); g.restore();
      }
    }
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

function shadowGround(z, size = 900, op = 0.22) {
  const p = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.ShadowMaterial({ opacity: op }));
  p.position.z = z; p.receiveShadow = true; scene.add(p);
}

function dashed(a, b) {
  const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a), new THREE.Vector3(...b)]);
  const l = new THREE.Line(g, new THREE.LineDashedMaterial({ color: 0x334455, dashSize: 3, gapSize: 2.2, transparent: true, opacity: 0.55 }));
  l.computeLineDistances(); scene.add(l);
}

const S = await (await fetch(BASE + 'scene.json')).json();
const [OW, OD, OH] = S.outer;

if (VIEW === 'hero' || VIEW === 'exploded') {
  const ex = VIEW === 'exploded';
  const off = { base: 0, d1: ex ? 30 : 0, lcd: ex ? 62 : 0, lid: ex ? 86 : 0, tsl: ex ? 108 : 0 };
  for (const p of S.parts) {
    const role = p.role;
    if (!ex && /^(d1|lcd)$/.test(role) && !/bezel|glass|d1_usb|d1_pcb/.test(p.name)) continue; // hidden inside
    const g = await load(p.file.replace('../stl/', ''));
    let dz = off[role] ?? 0;
    addMesh(g, p.color, p.name, [0, 0, dz], ex);
  }
  // LCD characters
  const v = S.lcd_view;
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(v.w, v.d), new THREE.MeshStandardMaterial({ map: lcdTexture(), emissive: 0xffffff, emissiveMap: lcdTexture(), emissiveIntensity: 0.55, roughness: 0.2 }));
  plane.position.set(v.cx, v.cy, v.z + 0.06 + (ex ? off.lcd : 0));
  scene.add(plane);
  shadowGround(-0.01, 900, ex ? 0.14 : 0.22);
  if (ex) { key.position.set(-50, -70, 420);
    dashed([S.lcd_view.cx - 30, S.lcd_view.cy, 20], [S.lcd_view.cx - 30, S.lcd_view.cy, 20 + off.lcd]);
    dashed([34, -7.6, 8], [34, -7.6, 8 + off.d1]);
    dashed([20, 16.9, 26], [20, 16.9, 26 + off.tsl]);
    camera.position.set(250, -330, 230);
    camera.lookAt(0, 0, 52);
    camera.fov = 25;
  } else {
    camera.position.set(170, -235, 190);
    camera.lookAt(4, 2, 9);
    camera.fov = 22;
  }
} else if (VIEW === 'print') {
  // print bed 220 x 220
  const bed = new THREE.Mesh(new THREE.BoxGeometry(230, 230, 4), new THREE.MeshStandardMaterial({ color: 0x2a2e33, roughness: 0.55, metalness: 0.2 }));
  bed.position.set(0, 0, -2); bed.receiveShadow = true; scene.add(bed);
  const tex = new THREE.Mesh(new THREE.PlaneGeometry(220, 220), new THREE.MeshStandardMaterial({ color: 0x3a3f46, roughness: 0.8 }));
  tex.position.z = 0.02; tex.receiveShadow = true; scene.add(tex);
  const grid = new THREE.GridHelper(220, 22, 0x6b7480, 0x4a515a); grid.rotation.x = Math.PI / 2; grid.position.z = 0.05; scene.add(grid);
  const gb = await load('lightcheck_base.stl');
  const gl = await load('lightcheck_lid.stl');
  addMesh(gb, '#0E7766', 'base', [0, -40, 0], true);
  addMesh(gl, '#F4F4F0', 'lid', [0, 40, 0], true);
  shadowGround(-4.1);
  camera.position.set(190, -380, 360);
  camera.lookAt(0, 6, 0);
  camera.fov = 27;
}
camera.aspect = W / H; camera.updateProjectionMatrix();
renderer.render(scene, camera);
window.__done = true;
</script></body></html>
